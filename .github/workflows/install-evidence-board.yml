name: Install Evidence Board Source

on:
  push:
    branches: [main]
    paths:
      - '.github/staging/evidence-board.ready'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and install exact tested Evidence Board package
        shell: bash
        run: |
          set -euo pipefail
          cat .github/staging/evidence-board.0.b64 \
              .github/staging/evidence-board.1.b64 \
              .github/staging/evidence-board.2.b64 \
              .github/staging/evidence-board.3.b64 \
            | tr -d '\r\n' \
            | base64 -d > /tmp/evidence-board.zip

          unzip -t /tmp/evidence-board.zip
          rm -rf saltybananaslugs-evidence-board
          unzip -q /tmp/evidence-board.zip -d .

          rm -f .github/staging/evidence-board.0.b64
          rm -f .github/staging/evidence-board.1.b64
          rm -f .github/staging/evidence-board.2.b64
          rm -f .github/staging/evidence-board.3.b64
          rm -f .github/staging/evidence-board.ready
          rm -f .github/workflows/install-evidence-board.yml

          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          if p.exists():
              text = p.read_text(encoding='utf-8')
              if '- Evidence Board' not in text:
                  marker = '- Environment\n'
                  if marker in text:
                      text = text.replace(marker, marker + '- Evidence Board\n', 1)
                  else:
                      text += '\n- Evidence Board\n'
                  p.write_text(text, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Add SaltyBananaSlug's Evidence Board v0.1.0"
          git push origin main
