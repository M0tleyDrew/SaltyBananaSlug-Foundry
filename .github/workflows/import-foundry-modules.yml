name: Import current Foundry modules from Google Drive

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sbs-module-import
  cancel-in-progress: true

jobs:
  import-modules:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Run SBS module import'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Report start to trigger issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment '${{ github.event.issue.number }}' --body 'SBS module import started. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Google Drive downloader
        run: python -m pip install --upgrade gdown

      - name: Import modules
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            shopt -s dotglob nullglob

            DRIVE_URL='https://drive.google.com/drive/folders/1ThTcLalqTZpf7m1-bO3ZMJTj0iua6keR'
            rm -rf /tmp/sbs-drive /tmp/sbs-files.json /tmp/sbs-failed.tsv
            mkdir -p /tmp/sbs-drive

            echo 'Listing complete Google Drive tree...'
            gdown --folder "$DRIVE_URL" --json > /tmp/sbs-files.json

            python - <<'PY'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path('/tmp/sbs-drive')
          items = json.loads(pathlib.Path('/tmp/sbs-files.json').read_text(encoding='utf-8'))
          failures = []

          print(f'Listed {len(items)} Drive files.')
          for index, item in enumerate(items, start=1):
              rel = pathlib.PurePosixPath(item['path'])
              dest = root.joinpath(*rel.parts)
              dest.parent.mkdir(parents=True, exist_ok=True)
              print(f'[{index}/{len(items)}] {rel}')
              proc = subprocess.run(
                  ['gdown', item['url'], '--output', str(dest)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if proc.returncode != 0:
                  print(f'  SKIPPED: {rel}')
                  failures.append((str(rel), item['url'], proc.stdout.strip()))

          failed_path = pathlib.Path('/tmp/sbs-failed.tsv')
          with failed_path.open('w', encoding='utf-8') as fh:
              for path, url, output in failures:
                  clean = output.replace('\t', ' ').replace('\r', ' ').replace('\n', ' | ')
                  fh.write(f'{path}\t{url}\t{clean}\n')

          print(f'Individual download pass complete. Failed files: {len(failures)}')
          PY

            echo 'Downloaded Drive tree sample:'
            find /tmp/sbs-drive -maxdepth 4 -type f | sort | head -250

            SOURCE='/tmp/sbs-drive'
            if [ "$(find "$SOURCE" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ]; then
              ONLY_DIR="$(find "$SOURCE" -mindepth 1 -maxdepth 1 -type d | head -1)"
              if find "$ONLY_DIR" -mindepth 1 -maxdepth 1 -type d -name 'saltybananaslug*' | grep -q . || [ -d "$ONLY_DIR/party-viewer" ]; then
                SOURCE="$ONLY_DIR"
              fi
            fi

            echo "Using source directory: $SOURCE"

            MODULES=(
              party-viewer
              saltybananaslug-actor-journal
              saltybananaslug-card-games
              saltybananaslug-character-sheets
              saltybananaslug-containers
              saltybananaslug-item-uploader
              saltybananaslug-merchants
              saltybananaslug-quests-objectives
              saltybananaslug-scene-piles
              saltybananaslug-scene-summarized
              saltybananaslug-web-viewer
              saltybananaslugs-danger-zones
              saltybananaslugs-factions
              saltybananaslugs-lore-module
              saltybananaslugs-message-cantrip
              saltybananaslugs-npc-memories
            )

            for module in "${MODULES[@]}"; do
              if [ ! -d "$SOURCE/$module" ]; then
                echo "ERROR: Expected module folder missing: $module" >&2
                echo 'Top-level downloaded directories:'
                find "$SOURCE" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
                exit 1
              fi
              rm -rf "$module"
              cp -a "$SOURCE/$module" "$module"
            done

            rm -rf '_SBS Environment Releases'
            rm -f 'Cards Macro.json'

            echo 'Imported module manifests:'
            find . -mindepth 2 -maxdepth 2 -name module.json -print | sort

            COUNT="$(find . -mindepth 2 -maxdepth 2 -name module.json | wc -l)"
            if [ "$COUNT" -ne 16 ]; then
              echo "ERROR: Expected 16 module manifests, found $COUNT" >&2
              exit 1
            fi

            git config user.name 'SaltyBananaSlug Import Bot'
            git config user.email '34432002+M0tleyDrew@users.noreply.github.com'
            git add --all
            if git diff --cached --quiet; then
              echo 'No module changes to commit.'
            else
              git commit -m 'Import current SaltyBananaSlug Foundry modules'
              git push
            fi

            FAILED_COUNT="$(wc -l < /tmp/sbs-failed.tsv | tr -d ' ')"
            echo "Bulk import committed. Authenticated Drive backfill required for $FAILED_COUNT file(s)."
            if [ "$FAILED_COUNT" -gt 0 ]; then
              echo 'Files requiring authenticated backfill:'
              cut -f1-2 /tmp/sbs-failed.tsv
            fi
          } 2>&1 | tee /tmp/sbs-import.log

      - name: Report result to trigger issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            if [ '${{ job.status }}' = 'success' ]; then
              echo 'SBS module bulk import workflow completed.'
            else
              echo 'SBS module bulk import workflow failed.'
            fi
            echo
            if [ -f /tmp/sbs-failed.tsv ]; then
              FAILED_COUNT="$(wc -l < /tmp/sbs-failed.tsv | tr -d ' ')"
              echo "Files requiring authenticated Drive backfill: $FAILED_COUNT"
              if [ "$FAILED_COUNT" -gt 0 ]; then
                echo
                echo '```text'
                cut -f1-2 /tmp/sbs-failed.tsv | tail -n 100
                echo '```'
              fi
            fi
            echo
            echo 'Last import log lines:'
            echo '```text'
            if [ -f /tmp/sbs-import.log ]; then
              tail -n 80 /tmp/sbs-import.log
            else
              echo 'Import log was not created; failure occurred before the import step.'
            fi
            echo '```'
            echo
            echo 'Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          } > /tmp/sbs-report.md
          gh issue comment '${{ github.event.issue.number }}' --body-file /tmp/sbs-report.md
